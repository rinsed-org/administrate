---
version: 2.1

orbs:
  browser-tools: circleci/browser-tools@1.5.3

commands:
  shared_steps:
    steps:
      - browser-tools/install-chrome
      - browser-tools/install-chromedriver

      - checkout

      # Install bundler
      - run: gem install bundler:2.3.5

      # Restore Cached Dependencies
      - restore_cache:
          name: Restore bundle cache
          key: administrate-{{ checksum "Gemfile.lock" }}

      # Bundle install dependencies
      - run: bundle install --path vendor/bundle

      # Cache Dependencies
      - save_cache:
          name: Store bundle cache
          key: administrate-{{ checksum "Gemfile.lock" }}
          paths:
            - vendor/bundle

      # Wait for DB
      - run: dockerize -wait tcp://localhost:5432 -timeout 1m

      # Setup the environment
      - run: cp .sample.env .env

      # Setup the database
      - run: bundle exec rake db:setup

      # Run the tests
      - run: bundle exec rspec

default_job: &default_job
  working_directory: ~/administrate
  steps:
    - browser-tools/install-browser-tools: 
        replace-existing-chrome: true
    - shared_steps
    # NOTE: the following steps have been commented out temporarily because of a breaking change in the appraisal gem
    # Its dependencies can no longer successfully be met and attempts to install it will fail.
    #
    # Run the tests against multiple versions of Rails
    # - run: bundle exec appraisal install
    # - run: bundle exec appraisal rspec

jobs:

  ruby-33:
    <<: *default_job
    docker:
      - image: cimg/ruby:3.3-browsers
        environment:
          PGHOST: localhost
          PGUSER: administrate
          RAILS_ENV: test
      - image: postgres:10.1-alpine
        environment:
          POSTGRES_USER: administrate
          POSTGRES_DB: ruby33
          POSTGRES_PASSWORD: ""

workflows:
  multiple-rubies:
    jobs:
      - ruby-33