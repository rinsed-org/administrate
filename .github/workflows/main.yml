name: CI

on:
  pull_request:
    branches: [ "**" ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        ruby: ['3.1']
    env:
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: postgres
      RACK_ENV: test
      RAILS_ENV: test

    services:
      postgres:
        image: postgres:14
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: administrate_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Ruby ${{ matrix.ruby }}
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true

      - name: Install dependencies
        run: bundle install

      - name: Setup environment
        run: cp .sample.env .env

      - name: Setup database configuration
        run: |
          if [ ! -f spec/example_app/config/database.yml.sample ]; then
            cp spec/example_app/config/database.yml spec/example_app/config/database.yml.sample
          fi
          cp spec/example_app/config/database.yml.sample spec/example_app/config/database.yml

      - name: Setup database schema
        run: |
          cd spec/example_app
          bundle exec rails db:create db:schema:load
          cd ../..

      - name: Run tests
        run: bundle exec rspec